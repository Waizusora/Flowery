name: Android Doze Emulator

on:
  push:
    branches: [try]
  pull_request:
    branches: [try]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flowery-doze-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  doze-emulator:
    name: Build and verify Android Doze transitions
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK and NDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          for attempt in 1 2 3; do
            if sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"; then
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then
              echo "Android SDK package installation failed; retrying ($attempt/3)."
              sleep 15
            fi
          done
          exit 1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - name: Generate native dependency lockfile
        working-directory: native
        run: cargo generate-lockfile

      - name: Run native unit tests
        working-directory: native
        run: cargo test --locked

      - name: Verify Kotlin and native JNI declarations
        run: python3 scripts/check_jni_contract.py

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Compile Android native test targets
        working-directory: native
        run: cargo ndk --platform 26 -t arm64-v8a -t x86_64 check --tests

      - name: Build Android native libraries
        working-directory: native
        run: cargo ndk --platform 26 -t arm64-v8a -t x86_64 -o ../app/src/main/jniLibs build --release

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Run Doze checks on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: "yes"
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/run_doze_emulator_checks.sh

      - name: Upload Doze diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flowery-doze-emulator-report
          path: build/doze-report/
          if-no-files-found: warn
