[package]
name = "flowery_audio"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
symphonia = { version = "0.5.4", features = ["all", "isomp4", "alac"] }
lofty = "0.25.5"
rubato = "5.0.1"
audioadapter-buffers = "5.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
libc = "0.2"
