[package]
name = "flowery_audio"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
symphonia = { version = "0.5.4", features = ["all", "isomp4", "alac"] }
lofty = "0.25.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
libc = "0.2"
libusb1-sys = { version = "0.7", features = ["vendored"] }
ureq = { version = "2.12", default-features = false, features = ["tls"] }
url = "2"
serde_yaml = "0.9"
